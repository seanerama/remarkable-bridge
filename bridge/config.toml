# remarkable-bridge configuration (TOML, stdlib tomllib — ADR-0001).

[routes]
# Tag names that route a document to an agent. Compared lowercased, exact
# (contract: tablet-document). "review" (Stage 1) and "execute" (Stage 4) are the two
# frozen routes (contract: agent-invocation). The execute route is gated by the
# [execute] kill-switch below, so listing it here is safe even while it is dark.
tags = ["review", "execute"]

[tablet]
# SSH host alias from ~/.ssh/config. On the dev server this points at the tablet's
# LAN/tailnet IP over WiFi SSH, NOT the USB address (ADR-0005, .verity/deploy-access.md).
ssh_host = "remarkable"
xochitl = "/home/root/.local/share/remarkable/xochitl"
# Create-only destination for published responses (contract: response-publish).
responses_folder = "/Claude/Responses"

[agent]
# Optional model override passed to `claude -p --model` (empty = CLI default).
model = ""
# Per-run timeout in seconds (ADR-0004 default 10 min).
timeout = 600

[execute]
# Dark-launch kill-switch for the Stage 4 execute route (the highest-risk surface: an
# agent that can Write/Edit/Bash inside a per-document sandbox). OFF => execute-tagged
# docs are skipped entirely, behavior identical to before Stage 4. Flip to true to enable,
# or override at runtime with the EXECUTE_ENABLED env var (1/true/yes/on). Default OFF.
enabled = false

[extract]
# Dark-launch kill-switch for the Stage 3 handwriting render path (Claude reads the
# rendered stroke PNGs directly — no OCR). OFF => typed-text-only, byte-for-byte the
# Stage 1/2 behavior. Flip to true to enable, or override at runtime with the
# EXTRACT_HANDWRITING env var (1/true/yes/on). Default OFF.
handwriting = false

[paths]
state = "~/.local/state/remarkable-bridge/state.json"
out = "out"
logs = "logs"
workspace = "workspace"

[watcher]
# Poll interval in seconds for the daemon loop (ADR-0005: ~60s).
poll_interval = 60

[cloud]
# reMarkable CLOUD watcher (Stage 6): the INBOX half. Polls the tablet's /Outbound folder
# via the reMarkable cloud API (works off-network) and hands each new note to the
# nightshift-assistant. Read-only transport — rmapi is only ever `ls`/`get` (no writes).
folder = "/Outbound"
# rmapi binary (ddvk fork), configured at ~/.config/rmapi/rmapi.conf on the host.
# Overridable at runtime with the RMAPI_BIN env var.
rmapi_bin = "rmapi"
# The nightshift control-CLI on the box PATH; the watcher shells
# `nightshift submit --type note-ingest --params <json>` (contract: note-submission).
# Overridable at runtime with the NIGHTSHIFT_BIN env var.
nightshift_bin = "nightshift"
# Per-note staging dir: extracted handwriting PNGs (page-NN.png) land under <staging>/<note-id>/,
# which becomes the submitted images_dir.
staging_dir = "~/.local/share/remarkable-bridge/notes"
# Poll interval in seconds for the watcher loop.
poll_interval = 60

[watch]
# Dark kill-switch for the whole Outbound watcher (Stage 6). OFF => the daemon loop is inert
# (returns immediately, never lists the cloud, never submits). Ships dark: install the
# systemd user unit but only `systemctl --user enable --now` it after flipping this to true
# (or set the WATCH_ENABLED env var to 1/true/yes/on). Default OFF.
enabled = false
