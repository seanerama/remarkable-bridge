name: CI
# remarkable-bridge — Verity hygiene gate (stack-agnostic).
# Honestly green on a fresh scaffold: secret-scan + a structure check, no faked
# pass. Lint and test gates are added when the Architect chooses the stack and the
# walking skeleton lands (the progressive gate — framework-spec §3).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read # gitleaks lists PR commits via the API on pull_request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          for f in README.md LICENSE; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
          echo "structure ok"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    # Walking-skeleton test lane: real modules + faked boundaries, no device, no model.
    # Provisions WeasyPrint's native deps so the PRODUCTION PDF renderer is exercised
    # here (the ReportLab fallback keeps local pytest green without these libs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WeasyPrint native deps (cairo/pango/gobject — ADR-0001)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev libharfbuzz0b fonts-dejavu-core
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
